<div class="eg-content-editor" data-type="textEditorWithoutHeading" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><p><strong><span class="selection-for-ai-start"></span>Benachbarte, unter Spannung stehende Teile abdecken oder <span style="color: rgba(30, 46, 217, 1);">abschranken</span>!<span class="selection-for-ai-end"></span></strong></p><p>Alle aktiven, noch unter Spannung stehenden Teile in der Nähe der Arbeitsstelle werden für die Dauer der Arbeiten <strong>abgedeckt oder abgesperrt</strong>.<br>So wird verhindert, dass Personen versehentlich in den Gefahrenbereich gelangen.</p></div></div>
