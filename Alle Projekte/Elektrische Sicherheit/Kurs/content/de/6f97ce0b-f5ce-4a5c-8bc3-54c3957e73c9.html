<div class="eg-content-editor" data-type="textEditorWithoutHeading" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><p><strong><span style="color: rgba(0, 0, 0, 1);">Gegen (Wieder-)Einschalten </span><span style="color: rgba(30, 46, 217, 1);">sichern!</span></strong></p><p>Alle Schalt- und Trennvorrichtungen müssen so gesichert werden, dass sie <strong>nicht unbeabsichtigt</strong> wieder eingeschaltet werden können.</p><p><br><u>Beispiele:</u><br>Vorhängeschlösser, Sperrvorrichtungen oder Hinweisschilder.</p></div></div>
