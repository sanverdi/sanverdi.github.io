<div class="eg-content-editor" data-type="textEditorOneColumn" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><h2>In Abhängigkeit der Spannung</h2><p>Laut International Electronics Commission gelten <strong>für gesunde Erwachsene Spannungen <span style="color: rgba(30, 46, 217, 1);">ab 50 Volt Wechselstrom (1 – 1000 Hz)</span></strong>und <strong><span style="color: rgba(30, 46, 217, 1);">120 Volt Gleichstrom</span> als lebensgefährlich</strong>, wenn der Körper <strong>länger als drei Sekunden davon durchströmt wird.</strong></p></div></div>
