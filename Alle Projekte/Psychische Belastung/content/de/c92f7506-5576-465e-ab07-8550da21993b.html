<div class="eg-content-editor" data-type="textEditorWithoutHeading" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><h2>Warum Stress jeden unterschiedlich trifft</h2><p><br></p><cite><span style="color: rgba(164, 131, 255, 1);">Jeder Mensch hat eine unterschiedliche "Belastungsgrenze".</span></cite><p><br></p><p>Manche kommen mit viel Stress gut zurecht, andere fühlen sich schneller überfordert.<br>Das hängt davon ab, wie "anfällig" jemand für Stress ist und wie viele Belastungen gleichzeitig auftreten.</p><p><span style="color: rgba(0, 0, 0, 1);"><br></span></p></div></div>
