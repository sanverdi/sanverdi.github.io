<div class="eg-content-editor" data-type="textEditorWithoutHeading" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><p>Erst wenn Anforderungen und individuelle Fähigkeiten im Gleichgewicht sind, werden Motivation, Entwicklung und Leistung gefördert.</p><p>In diesem Abschnitt erfährst Du, warum die richtige Balance entscheidend ist und welche Auswirkungen Unter- und Überforderung haben können.</p></div></div>
