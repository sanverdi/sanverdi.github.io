<div class="eg-content-editor" data-type="textEditorWithoutHeading" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><p>Wichtig ist nicht ein einzelner Tag. <strong>Entscheidend ist, ob Beschwerden über längere Zeit bleiben, stärker werden oder den Alltag spürbar beeinflussen.</strong> Wenn Erschöpfung, Antriebslosigkeit oder Interessenverlust über Wochen anhalten, kann das auf eine ernstzunehmende psychische Belastung hinweisen.</p></div></div>
