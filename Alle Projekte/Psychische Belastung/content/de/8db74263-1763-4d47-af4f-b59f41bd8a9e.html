<div class="eg-content-editor" data-type="textEditorWithoutHeading" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><h2>Mögliche Auswirkungen</h2><p>Dauerhafte Belastungen am Arbeitsplatz können vielfältige gesundheitliche und arbeitsbezogene Folgen haben. Sie betreffen sowohl das körperliche als auch das psychische Wohlbefinden und können langfristig zu Leistungseinbußen sowie erhöhten Fehlzeiten führen.</p></div></div>
