<div class="eg-content-editor" data-type="textEditorWithoutHeading" style="width: 100%;"><div class="column" style="display: inline-block; width: 100%; vertical-align: top;"><h2>Warum die richtige Anforderung entscheidend ist</h2><p>Täglich stehen wir vor Aufgaben mit unterschiedlichen Anforderungen.<br>Sind diese zu niedrig, entsteht schnell Langeweile. Sind sie zu hoch, kann Überlastung die Folge sein.</p></div></div>
